<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>蔡鼻鼻的生日蠟燭</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
  :root{
    --bg0:#fdf5f9; --bg1:#f1e4f2; --bg-glow:#f7dcec;
    --cream:#4a3548; --cream-dim:#8d7389; --faint:#a893a4;
    --flame:#f6b63e; --glow:#f0a24b; --ember:#e8833c;
    --rose:#e08bb0; --rose-deep:#b05c8a; --gold:#8a63c0; --lav:#9d7bd8;
    --cake1:#f8ecf4; --cake2:#fbf2f8; --plate:#e8d8e6;
    --card:#ffffff; --card-edge:#ecdbe9;
    --serif:'Noto Serif TC', 'PMingLiU', serif;
    --sans:'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:var(--sans); color:var(--cream);
    background:
      radial-gradient(1100px 700px at 50% 88%, var(--bg-glow) 0%, transparent 62%),
      radial-gradient(900px 600px at 50% 100%, #f2d7ea 0%, transparent 55%),
      linear-gradient(180deg, #fdf8fb 0%, var(--bg1) 100%);
    background-color:var(--bg0);
    min-height:100dvh; overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  .stage{
    min-height:100dvh; display:flex; flex-direction:column; align-items:center;
    justify-content:space-between; padding:clamp(18px,4vh,40px) 20px calc(20px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto; position:relative;
  }

  /* ---------- header ---------- */
  header{text-align:center; z-index:2;}
  .eyebrow{
    font-size:12px; letter-spacing:.42em; text-indent:.42em; color:var(--rose);
    text-transform:uppercase; margin-bottom:10px; opacity:0; animation:rise .9s .2s ease forwards;
  }
  h1{
    font-family:var(--serif); font-weight:900; text-wrap:balance;
    font-size:clamp(30px,8vw,46px); line-height:1.25; letter-spacing:.04em;
    color:var(--cream);
    text-shadow:0 2px 30px rgba(224,139,176,.38);
    opacity:0; animation:rise .9s .45s ease forwards;
  }
  h1 .name{color:var(--rose-deep);}
  .bless{
    margin-top:12px; color:var(--cream-dim); font-size:clamp(14px,3.8vw,16px); line-height:1.9;
    opacity:0; animation:rise .9s .7s ease forwards;
  }
  @keyframes rise{from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:none;}}

  /* ---------- cake scene ---------- */
  .scene{position:relative; width:min(86vw,360px); z-index:1; margin:10px 0;}
  .halo{
    position:absolute; left:50%; top:-40px; transform:translateX(-50%);
    width:150%; aspect-ratio:1; border-radius:50%; pointer-events:none;
    background:radial-gradient(circle, rgba(240,167,205,.32) 0%, rgba(157,123,216,.10) 38%, transparent 68%);
    transition:opacity 1.4s ease; animation:breathe 3.4s ease-in-out infinite;
  }
  @keyframes breathe{50%{transform:translateX(-50%) scale(1.05);}}
  .cake-svg{display:block; width:100%; height:auto; filter:drop-shadow(0 16px 26px rgba(122,84,118,.22)); pointer-events:none;}

  .candles{
    position:absolute; left:0; right:0; top:calc(41.6% - 58px); height:0;
    display:flex; justify-content:center; gap:16%; padding:0 18%; z-index:2;
  }
  .candle{
    position:relative; width:4.2%; min-width:13px; height:58px; cursor:pointer;
    touch-action:none; -webkit-user-select:none; user-select:none;
  }
  .stick{
    position:absolute; inset:0; border-radius:4px 4px 2px 2px;
    background:repeating-linear-gradient(-48deg, #fdf0f6 0 5px, var(--rose) 5px 10px);
    box-shadow:inset -2px 0 3px rgba(0,0,0,.22);
  }
  .candle:nth-child(2) .stick{
    background:repeating-linear-gradient(-48deg, #fdf0f6 0 5px, var(--lav) 5px 10px);
  }
  .wick{
    position:absolute; top:-7px; left:50%; transform:translateX(-50%);
    width:2px; height:8px; background:#3a2620; border-radius:1px;
  }
  .flame-box{
    position:absolute; bottom:calc(100% + 6px); left:50%; width:18px; height:34px;
    transform:translateX(-50%) rotate(calc(var(--wind,0) * -22deg)) scaleY(calc(1 - var(--wind,0)*.34));
    transform-origin:50% 100%;
    transition:transform .14s ease-out;
  }
  .flame{
    position:absolute; inset:0;
    background:radial-gradient(circle at 50% 82%, #fff5d6 0%, var(--flame) 38%, var(--ember) 76%, transparent 100%);
    border-radius:50% 50% 50% 50% / 62% 62% 38% 38%;
    animation:flick .18s ease-in-out infinite alternate;
    filter:drop-shadow(0 0 8px rgba(240,162,75,.55)) drop-shadow(0 0 22px rgba(232,131,60,.28));
  }
  .flame::after{
    content:''; position:absolute; left:50%; bottom:5px; transform:translateX(-50%);
    width:7px; height:13px; border-radius:50% 50% 50% 50%/60% 60% 40% 40%;
    background:radial-gradient(circle at 50% 80%, #fff 0%, #ffe9b0 70%, transparent 100%);
  }
  @keyframes flick{
    from{transform:scale(1) rotate(-2.5deg);}
    to{transform:scale(1.08,.94) rotate(2.5deg);}
  }
  .candle.out .flame-box{display:none;}
  .candle.out .wick{background:#241713;}

  .puff{
    position:absolute; bottom:calc(100% + 8px); left:50%; width:12px; height:12px; border-radius:50%;
    background:radial-gradient(circle, rgba(150,128,150,.55), transparent 70%);
    pointer-events:none; animation:smoke 1.5s ease-out forwards;
  }
  @keyframes smoke{
    0%{opacity:.9; transform:translate(-50%,0) scale(.6);}
    100%{opacity:0; transform:translate(calc(-50% + var(--dx,0px)),-72px) scale(2.6);}
  }

  /* ---------- footer / controls ---------- */
  .controls{text-align:center; z-index:2; width:100%;}
  .hint{min-height:52px; color:var(--cream-dim); font-size:15px; line-height:1.8;}
  .hint b{color:var(--gold); font-weight:700;}
  .meter{
    width:min(220px,70%); height:5px; margin:10px auto 14px; border-radius:99px;
    background:#ecd9ea; overflow:hidden; opacity:0; transition:opacity .4s;
  }
  .meter.on{opacity:1;}
  .meter i{
    display:block; height:100%; width:0%; border-radius:99px;
    background:linear-gradient(90deg, var(--rose), var(--lav));
    transition:width .1s linear;
  }
  .btn{
    font-family:var(--sans); font-weight:700; font-size:16px; letter-spacing:.06em;
    color:#fff; background:linear-gradient(135deg, #e893b8, #a17be0);
    border:none; border-radius:99px; padding:14px 34px; cursor:pointer;
    text-shadow:0 1px 6px rgba(120,60,120,.3);
    box-shadow:0 8px 22px rgba(161,123,224,.38), inset 0 1px 0 rgba(255,255,255,.35);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn:focus-visible{outline:3px solid var(--lav); outline-offset:3px;}
  .btn.ghost{
    background:transparent; color:var(--cream-dim); box-shadow:none;
    border:1px solid var(--card-edge); font-weight:500; font-size:14px; padding:10px 22px;
  }
  .mic-chip{
    display:inline-flex; align-items:center; gap:7px; margin-top:12px;
    font-size:12.5px; color:var(--faint); letter-spacing:.05em;
  }
  .mic-chip .dot{width:7px; height:7px; border-radius:50%; background:#d4bfd2;}
  .mic-chip.live .dot{background:#6fae68; box-shadow:0 0 8px #8fd18a; animation:pulse 1.6s infinite;}
  .mic-chip.live{color:var(--cream-dim);}
  @keyframes pulse{50%{opacity:.4;}}

  /* ---------- overlays ---------- */
  .overlay{
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    padding:24px; background:rgba(74,53,72,.35); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none; transition:opacity .45s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .panel{
    width:min(440px,100%); background:var(--card); border:1px solid var(--card-edge);
    border-radius:22px; padding:30px 26px 26px; text-align:center;
    box-shadow:0 24px 60px rgba(120,84,120,.28);
    transform:translateY(16px); transition:transform .45s ease;
  }
  .overlay.show .panel{transform:none;}
  .panel h2{
    font-family:var(--serif); font-weight:900; font-size:24px; letter-spacing:.05em;
    color:var(--rose-deep); margin-bottom:8px; text-wrap:balance;
  }
  .panel p{color:var(--cream-dim); font-size:14.5px; line-height:1.9; margin-bottom:18px;}
  .panel .star{font-size:34px; display:block; margin-bottom:10px; filter:drop-shadow(0 0 12px rgba(255,209,102,.6));}
  .wish-input{
    width:100%; font-family:var(--sans); font-size:16px; color:var(--cream);
    background:#fdf7fb; border:1.5px solid var(--card-edge); border-radius:14px;
    padding:14px 16px; margin-bottom:16px; resize:none; line-height:1.7;
  }
  .wish-input:focus{outline:none; border-color:var(--lav); box-shadow:0 0 0 3px rgba(157,123,216,.22);}
  .wish-input::placeholder{color:var(--faint);}
  .bless-from{color:var(--cream-dim); font-size:13.5px; letter-spacing:.14em; margin-top:6px;}
  .bless-tags{display:flex; gap:10px; flex-wrap:wrap; justify-content:center;}
  .bless-tags span{
    font-family:var(--serif); font-weight:900; color:var(--gold);
    background:#fff; border:1px solid var(--card-edge); border-radius:99px;
    padding:9px 20px; font-size:15px; letter-spacing:.14em;
    box-shadow:0 6px 16px rgba(120,84,120,.14);
    opacity:0; animation:rise .6s ease forwards;
  }
  .bless-tags span:nth-child(1){animation-delay:1.5s;}
  .bless-tags span:nth-child(2){animation-delay:1.7s;}
  .bless-tags span:nth-child(3){animation-delay:1.9s;}

  /* ---------- finale ---------- */
  .finale{
    position:fixed; inset:0; z-index:9; display:none; flex-direction:column; align-items:center;
    justify-content:flex-start; gap:20px;
    padding:clamp(40px,9vh,72px) 22px calc(40px + env(safe-area-inset-bottom)); text-align:center;
    background:
      radial-gradient(900px 600px at 50% 20%, rgba(157,123,216,.16) 0%, transparent 60%),
      linear-gradient(180deg, #fdf6fa 0%, #f0e3f2 100%);
    overflow-y:auto;
  }
  .finale.show{display:flex; animation:fadein .8s ease;}
  @keyframes fadein{from{opacity:0;} to{opacity:1;}}
  .finale h2{
    font-family:var(--serif); font-weight:900; font-size:clamp(28px,7.5vw,40px);
    letter-spacing:.06em; line-height:1.4; color:var(--cream); text-wrap:balance;
    text-shadow:0 2px 36px rgba(224,139,176,.4);
  }
  .finale h2 em{font-style:normal; color:var(--rose);}
  .finale .sub{color:var(--cream-dim); font-size:15px; line-height:1.9; max-width:38ch;}
  .wishes{display:flex; flex-direction:column; gap:12px; width:min(420px,100%); margin-top:6px;}
  .wish-card{
    background:var(--card); border:1px solid var(--card-edge); border-radius:16px;
    box-shadow:0 8px 22px rgba(120,84,120,.14);
    padding:14px 18px; display:flex; gap:12px; align-items:baseline; text-align:left;
    opacity:0; transform:translateY(14px); animation:rise .7s ease forwards;
  }
  .wish-card:nth-child(1){animation-delay:.5s;} .wish-card:nth-child(2){animation-delay:.8s;} .wish-card:nth-child(3){animation-delay:1.1s;}
  .wish-card .n{
    font-family:var(--serif); font-weight:900; color:var(--gold); font-size:18px; flex:none;
  }
  .wish-card .t{color:var(--cream); font-size:15px; line-height:1.75; overflow-wrap:anywhere;}
  #confetti{position:fixed; inset:0; z-index:12; pointer-events:none;}

  /* ---------- photo gallery ---------- */
  .gal-title{
    color:var(--cream-dim); font-size:13.5px; letter-spacing:.14em; margin-top:8px;
  }
  .gallery{
    display:flex; flex-wrap:wrap; justify-content:center; gap:18px;
    padding:14px 4px 10px; width:min(460px,100%);
  }
  .polaroid{
    flex:none; width:min(150px, 42vw); background:#fff; padding:8px 8px 24px; border-radius:5px;
    box-shadow:0 12px 26px rgba(120,84,120,.22);
    transform:rotate(-2.4deg); margin:0;
    opacity:0; animation:rise .7s 1.3s ease forwards;
  }
  .polaroid:nth-child(even){transform:rotate(2.2deg);}
  .polaroid img{display:block; width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:3px; background:#f2e6f0;}

  @media (prefers-reduced-motion: reduce){
    .flame{animation:none;}
    .halo{animation:none;}
    *{transition-duration:.01s !important;}
  }
</style>
</head>
<body>


<div class="stage" id="stage">
  <header>
    <div class="eyebrow">Happy Birthday</div>
    <h1>親愛的<span class="name">蔡鼻鼻</span>，<br>生日快樂！</h1>
    <p class="bless">胖胖～今天世界上最重要的事，就是你出生了 🎂<br>對著螢幕吹熄三根蠟燭，許下三個願望吧。</p>
  </header>

  <div class="scene">
    <div class="halo" id="halo"></div>
    <div class="candles" id="candles">
      <div class="candle" data-i="0" role="button" tabindex="0" aria-label="蠟燭一">
        <div class="flame-box"><div class="flame"></div></div><div class="wick"></div><div class="stick"></div>
      </div>
      <div class="candle" data-i="1" role="button" tabindex="0" aria-label="蠟燭二">
        <div class="flame-box"><div class="flame"></div></div><div class="wick"></div><div class="stick"></div>
      </div>
      <div class="candle" data-i="2" role="button" tabindex="0" aria-label="蠟燭三">
        <div class="flame-box"><div class="flame"></div></div><div class="wick"></div><div class="stick"></div>
      </div>
    </div>
    <svg class="cake-svg" viewBox="0 0 360 250" aria-hidden="true">
      <ellipse cx="180" cy="228" rx="152" ry="17" fill="#d8c3d8"/>
      <ellipse cx="180" cy="222" rx="146" ry="16" fill="var(--plate)"/>
      <!-- bottom tier -->
      <rect x="62" y="150" width="236" height="74" rx="14" fill="var(--cake1)"/>
      <rect x="62" y="150" width="236" height="22" rx="11" fill="#eeb3cf"/>
      <g fill="#eeb3cf">
        <circle cx="84" cy="174" r="9"/><circle cx="112" cy="171" r="7"/><circle cx="142" cy="176" r="10"/>
        <circle cx="174" cy="170" r="7"/><circle cx="204" cy="177" r="9"/><circle cx="236" cy="171" r="7"/>
        <circle cx="264" cy="175" r="9"/><circle cx="288" cy="170" r="6"/>
      </g>
      <!-- top tier -->
      <rect x="94" y="96" width="172" height="60" rx="12" fill="var(--cake2)"/>
      <rect x="94" y="96" width="172" height="19" rx="9" fill="#f3c3da"/>
      <g fill="#f3c3da">
        <circle cx="112" cy="117" r="8"/><circle cx="138" cy="114" r="6"/><circle cx="164" cy="119" r="9"/>
        <circle cx="192" cy="113" r="6"/><circle cx="218" cy="118" r="8"/><circle cx="246" cy="114" r="6"/>
      </g>
      <!-- sprinkles -->
      <g fill="var(--rose)">
        <circle cx="120" cy="188" r="3.2"/><circle cx="170" cy="196" r="3.2"/>
        <circle cx="228" cy="190" r="3.2"/><circle cx="272" cy="198" r="3.2"/>
        <circle cx="140" cy="132" r="3"/><circle cx="212" cy="136" r="3"/><circle cx="248" cy="126" r="3"/>
      </g>
      <g fill="#b48fd8">
        <circle cx="96" cy="196" r="3"/><circle cx="198" cy="184" r="3"/><circle cx="252" cy="204" r="3"/>
        <circle cx="118" cy="126" r="2.8"/><circle cx="178" cy="128" r="2.8"/>
      </g>
    </svg>
  </div>

  <div class="controls">
    <div class="meter" id="meter"><i id="meterBar"></i></div>
    <p class="hint" id="hint">準備好了嗎？開麥克風用吹的，<br>或<b>按住蠟燭</b>把它吹熄。</p>
    <button class="btn" id="startBtn">🎙️ 開啟麥克風，準備吹蠟燭</button>
    <div class="mic-chip" id="micChip"><span class="dot"></span><span id="micText">麥克風未開啟</span></div>
  </div>
</div>

<!-- wish overlay -->
<div class="overlay" id="wishOverlay" aria-modal="true" role="dialog">
  <div class="panel">
    <span class="star">🌠</span>
    <h2 id="wishTitle">許下第一個願望</h2>
    <p>蠟燭熄了，煙還在飄——趁現在，把願望悄悄寫下來。<br>只有你自己看得到。</p>
    <textarea class="wish-input" id="wishInput" rows="2" maxlength="120" placeholder="我希望⋯⋯"></textarea>
    <button class="btn" id="wishBtn">封存這個願望 ✨</button>
  </div>
</div>

<!-- finale -->
<div class="finale" id="finale">
  <h2>三個願望，<em>都收到了</em> 💌</h2>
  <p class="sub">蔡鼻鼻（aka 胖胖、胖鼻）——<br>願望已經乘著蠟燭的煙送往宇宙，<br>接下來這一年，就等著它們一個個實現吧。</p>
  <div class="wishes" id="wishList"></div>
  <p class="bless-from">除了你的願望，我也偷偷為你準備了三個祝福——</p>
  <div class="bless-tags"><span>身體健康</span><span>心想事成</span><span>發大財</span></div>

<canvas id="confetti"></canvas>

<script>
(function(){
  'use strict';
  var candlesEl = Array.prototype.slice.call(document.querySelectorAll('.candle'));
  var hint = document.getElementById('hint');
  var startBtn = document.getElementById('startBtn');
  var micChip = document.getElementById('micChip');
  var micText = document.getElementById('micText');
  var meter = document.getElementById('meter');
  var meterBar = document.getElementById('meterBar');
  var halo = document.getElementById('halo');
  var overlay = document.getElementById('wishOverlay');
  var wishTitle = document.getElementById('wishTitle');
  var wishInput = document.getElementById('wishInput');
  var wishBtn = document.getElementById('wishBtn');
  var finale = document.getElementById('finale');
  var wishList = document.getElementById('wishList');
  var againBtn = document.getElementById('againBtn');
  var stageEl = document.getElementById('stage');

  var NAMES = ['第一個','第二個','第三個'];
  var wishes = [];
  var lit = [true,true,true];
  var pendingWish = false;  // a blown-out candle is waiting for its wish to be saved
  var paused = true;        // detection paused (before start / while modal open / finale)
  var cooldownUntil = 0;
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- audio ---------- */
  var audioCtx=null, analyser=null, freqData=null, timeData=null, micLive=false;
  var noiseFloor=6, blowMs=0, lastT=0, micStart=0, maxSeen=0, tapTipShown=false;

  function startMic(){
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ return fallback('這個瀏覽器不支援麥克風'); }
    // IMPORTANT: create + resume the AudioContext synchronously inside the tap
    // gesture — iOS Safari keeps it muted otherwise.
    var AC = window.AudioContext || window.webkitAudioContext;
    if(AC && !audioCtx){ try{ audioCtx = new AC(); }catch(e){} }
    if(!audioCtx){ return fallback('沒辦法啟動音訊'); }
    if(audioCtx.state==='suspended'){ audioCtx.resume(); }
    // ask for RAW audio first: default noise suppression filters out blowing sounds
    var raw = {audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}};
    navigator.mediaDevices.getUserMedia(raw)
      .catch(function(){ return navigator.mediaDevices.getUserMedia({audio:true}); })
      .then(function(stream){
        var src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 1024;
        analyser.smoothingTimeConstant = 0.4;
        src.connect(analyser);
        freqData = new Uint8Array(analyser.frequencyBinCount);
        timeData = new Uint8Array(analyser.fftSize);
        micLive = true; paused = false; micStart = performance.now(); maxSeen = 0;
        micChip.classList.add('live'); micText.textContent = '麥克風已開啟';
        meter.classList.add('on');
        startBtn.style.display='none';
        setHint('深吸一口氣——<b>對著手機下方的麥克風用力吹！</b><br><span style="font-size:13px;color:var(--faint)">吹不動的話，按住蠟燭也可以</span>');
        if(audioCtx.state==='suspended'){ audioCtx.resume(); }
      })
      .catch(function(){ fallback('沒拿到麥克風權限'); });
  }
  // iOS sometimes re-suspends the context; nudge it awake on any touch
  document.addEventListener('click', function(){
    if(audioCtx && audioCtx.state==='suspended'){ audioCtx.resume(); }
  }, true);
  function fallback(msg){
    micLive=false; paused=false;
    startBtn.style.display='none';
    micText.textContent = msg + '，改用手指也可以';
    setHint('這裡收不到吹氣聲，改用手指吹——<br><b>按住蠟燭</b>不放，火焰會慢慢被「吹」熄 😉');
  }
  function level(){
    // blowing into a mic = broadband low-frequency rumble; use BOTH the low
    // frequency bins and the raw waveform RMS, and take whichever is stronger
    analyser.getByteFrequencyData(freqData);
    var n = 46, s = 0; // ~0–2kHz at 48k/1024
    for(var i=2;i<n;i++) s += freqData[i];
    var freqAvg = s/(n-2);
    analyser.getByteTimeDomainData(timeData);
    var q = 0;
    for(var j=0;j<timeData.length;j+=4){ var d=timeData[j]-128; q+=d*d; }
    var rms = Math.sqrt(q/(timeData.length/4)); // 0..128
    return Math.max(freqAvg, rms*2.6);
  }

  /* ---------- main loop ---------- */
  function loop(t){
    requestAnimationFrame(loop);
    var dt = lastT ? Math.min(t-lastT,100) : 16; lastT = t;
    if(!micLive || paused){ setWind(0); meterBar.style.width='0%'; return; }
    var v = level();
    if(v > maxSeen) maxSeen = v;
    if(v < noiseFloor*1.4) noiseFloor = noiseFloor*0.98 + v*0.02; // track ambient
    var thresh = Math.max(noiseFloor*1.7, noiseFloor+15, 22);
    var strength = Math.max(0, Math.min(1, (v-thresh)/50 + (v>thresh?0.4:0)));
    meterBar.style.width = Math.round(Math.min(1, v/ (thresh*1.4))*100) + '%';
    // live feedback so it's obvious whether sound is reaching the page at all
    if(strength>0){ micText.textContent='🌬️ 收到了——繼續吹！'; }
    else if(v > thresh*0.45){ micText.textContent='有收到聲音——再用力、再靠近一點！'; }
    setWind(strength);
    var now = performance.now();
    if(strength>0 && now>cooldownUntil){
      blowMs += dt;
      if(blowMs > 240){ blowMs = 0; cooldownUntil = now+900; extinguishNext(); }
    }else{
      blowMs = Math.max(0, blowMs - dt*1.6);
    }
    // fast feedback if the mic is silent (blocked webview, muted hardware, ...)
    if(now-micStart>4000 && maxSeen<10 && litCount()===3 && wishes.length===0){
      micText.textContent='收不到聲音——換瀏覽器開，或點蠟燭';
      if(!tapTipShown){ tapTipShown=true; setHint('麥克風好像收不到聲音——<b>按住蠟燭</b>也可以吹熄！'); }
    }else if(!tapTipShown && wishes.length===0 && litCount()===3 && now-micStart>9000){
      tapTipShown = true;
      setHint('再靠近一點、對著<b>手機下方的麥克風</b>用力吹～<br>或者<b>按住蠟燭</b>也可以！');
    }
  }
  requestAnimationFrame(loop);

  function setWind(w){
    if(reduced) w = 0;
    for(var i=0;i<candlesEl.length;i++){
      if(lit[i]) candlesEl[i].querySelector('.flame-box').style.setProperty('--wind', w.toFixed(2));
    }
  }

  /* ---------- candles ---------- */
  function litCount(){ return lit.filter(Boolean).length; }
  function extinguishNext(){
    for(var i=0;i<3;i++){ if(lit[i]){ extinguish(i); return; } }
  }
  function extinguish(i){
    if(!lit[i] || pendingWish) return;
    pendingWish = true;
    lit[i]=false;
    var c = candlesEl[i];
    c.classList.add('out');
    for(var p=0;p<3;p++){
      var puff = document.createElement('span');
      puff.className='puff';
      puff.style.setProperty('--dx', ((Math.random()*36)-18).toFixed(0)+'px');
      puff.style.animationDelay = (p*0.18)+'s';
      c.appendChild(puff);
      setTimeout(function(el){ return function(){ el.remove(); }; }(puff), 2200);
    }
    halo.style.opacity = (0.35 + litCount()*0.22).toFixed(2);
    paused = true; setWind(0);
    setTimeout(openWish, 750);
  }
  // press-and-hold a candle to "blow" it out: the flame leans harder and
  // harder, and after ~0.8s it goes out — works everywhere, mic or no mic.
  var HOLD_MS = 800;
  var holdCandle = -1, holdStart = 0, holdRAF = null;
  function canTouch(i){
    return lit[i] && !pendingWish &&
      !overlay.classList.contains('show') && !finale.classList.contains('show');
  }
  function beginPlay(){
    if(startBtn.style.display!=='none'){
      startBtn.style.display='none';
      micText.textContent='用手指吹蠟燭中';
    }
  }
  function windOne(i, w){
    candlesEl[i].querySelector('.flame-box').style.setProperty('--wind', w.toFixed(2));
  }
  function startHold(i){
    if(!canTouch(i)) return;
    beginPlay();
    holdCandle = i; holdStart = performance.now();
    (function tick(){
      if(holdCandle<0) return;
      var p = (performance.now()-holdStart)/HOLD_MS;
      if(p>=1){
        var c2 = holdCandle; endHold();
        paused=false; extinguish(c2);
        return;
      }
      windOne(holdCandle, 0.25 + p*0.75);
      holdRAF = requestAnimationFrame(tick);
    })();
  }
  function endHold(){
    if(holdRAF) cancelAnimationFrame(holdRAF);
    if(holdCandle>=0 && lit[holdCandle]) windOne(holdCandle, 0);
    holdCandle = -1; holdRAF = null;
  }
  candlesEl.forEach(function(c){
    var i = +c.dataset.i;
    c.addEventListener('pointerdown', function(e){ e.preventDefault(); startHold(i); });
    c.addEventListener('click', function(){
      // a quick tap just makes the flame flicker and teaches the gesture
      if(!canTouch(i)) return;
      beginPlay();
      if(holdCandle<0){ setHint('<b>按住蠟燭</b>不放，像吹氣一樣把它吹熄！'); }
    });
    c.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        if(canTouch(i)){ beginPlay(); paused=false; extinguish(i); }
      }
    });
  });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    document.addEventListener(ev, endHold);
  });

  /* ---------- wishes ---------- */
  function openWish(){
    wishTitle.textContent = '許下' + NAMES[wishes.length] + '願望';
    wishInput.value='';
    overlay.classList.add('show');
    setTimeout(function(){ wishInput.focus(); }, 350);
  }
  function saveWish(){
    var text = wishInput.value.trim() || '（一個不能說出來的秘密願望）';
    wishes.push(text);
    pendingWish = false;
    overlay.classList.remove('show');
    if(litCount()>0){
      paused=false;
      setHint('願望封存！還剩 <b>'+litCount()+'</b> 根蠟燭——'+(micLive?'繼續吹！':'按住下一根蠟燭！'));
    }else{
      setTimeout(showFinale, 500);
    }
  }
  wishBtn.addEventListener('click', saveWish);
  wishInput.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); saveWish(); }
  });

  /* ---------- finale ---------- */
  function showFinale(){
    wishList.innerHTML='';
    for(var i=0;i<wishes.length;i++){
      var d=document.createElement('div'); d.className='wish-card';
      var n=document.createElement('span'); n.className='n'; n.textContent='願 '+(i+1);
      var t=document.createElement('span'); t.className='t'; t.textContent=wishes[i];
      d.appendChild(n); d.appendChild(t); wishList.appendChild(d);
    }
    finale.classList.add('show');
    stageEl.setAttribute('aria-hidden','true');
    confettiBurst();
  }
  againBtn.addEventListener('click', function(){
    wishes=[]; lit=[true,true,true]; pendingWish=false;
    candlesEl.forEach(function(c){ c.classList.remove('out'); });
    halo.style.opacity='1';
    finale.classList.remove('show');
    stageEl.removeAttribute('aria-hidden');
    stopConfetti();
    paused=false;
    if(!micLive && startBtn.dataset.used!=='1' && navigator.mediaDevices){
      // keep tap mode; mic can't be re-prompted cleanly everywhere
    }
    setHint(micLive ? '蠟燭重新點好了——<b>再吹一次！</b>' : '蠟燭重新點好了——<b>按住蠟燭</b>吹熄它！');
  });

  /* ---------- confetti ---------- */
  var canvas=document.getElementById('confetti'), ctx2=canvas.getContext('2d');
  var pieces=[], confettiOn=false, rafC=null;
  var COLORS=['#e08bb0','#9d7bd8','#f4c6da','#b05c8a','#c9a1e8','#f6b63e'];
  function resize(){ canvas.width=innerWidth*devicePixelRatio; canvas.height=innerHeight*devicePixelRatio; }
  addEventListener('resize', resize); resize();
  function confettiBurst(){
    var count = reduced ? 40 : 160;
    pieces=[];
    for(var i=0;i<count;i++){
      pieces.push({
        x:Math.random()*canvas.width, y:-20-Math.random()*canvas.height*0.5,
        w:(5+Math.random()*6)*devicePixelRatio, h:(8+Math.random()*8)*devicePixelRatio,
        vy:(1.4+Math.random()*2.4)*devicePixelRatio, vx:(Math.random()-.5)*1.6*devicePixelRatio,
        rot:Math.random()*Math.PI, vr:(Math.random()-.5)*.16,
        color:COLORS[i%COLORS.length]
      });
    }
    confettiOn=true;
    var start=performance.now();
    (function draw(t){
      if(!confettiOn) return;
      ctx2.clearRect(0,0,canvas.width,canvas.height);
      for(var j=0;j<pieces.length;j++){
        var p=pieces[j];
        p.x+=p.vx+Math.sin((t/600)+j)*0.6*devicePixelRatio; p.y+=p.vy; p.rot+=p.vr;
        if(p.y>canvas.height+30) { p.y=-30; p.x=Math.random()*canvas.width; }
        ctx2.save(); ctx2.translate(p.x,p.y); ctx2.rotate(p.rot);
        ctx2.fillStyle=p.color; ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h); ctx2.restore();
      }
      if(t-start>12000){ stopConfetti(); return; }
      rafC=requestAnimationFrame(draw);
    })(performance.now());
  }
  function stopConfetti(){
    confettiOn=false;
    if(rafC) cancelAnimationFrame(rafC);
    ctx2.clearRect(0,0,canvas.width,canvas.height);
  }

  /* ---------- misc ---------- */
  function setHint(html){ hint.innerHTML = html; }
  startBtn.addEventListener('click', function(){ startBtn.dataset.used='1'; startMic(); });
})();
</script>
